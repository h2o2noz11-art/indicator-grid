name: Update indicator data

on:
  schedule:
    # 毎日 日本時間9:00頃に実行（UTC 0:00）。無料のGitHub Actions枠内で完結。
    - cron: "0 0 * * *"
  workflow_dispatch: {}  # 手動実行ボタンも使えるようにする

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch-data.py

      - name: Commit and push if changed
        run: |
          git config user.name "indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || git commit -m "chore: auto-update indicator data"
          git push
